    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // Configuración y Cliente de Supabase
        const SUPABASE_URL = "https://uylnumfofwykwjamwtwk.supabase.co";
        const SUPABASE_KEY = "sb_publishable_-F-3L3EmsN2DGdQ3xLvKgQ_0_DFq1CY";
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        // Configuración Comercial para Venta de Licencias
        const WHATSAPP_VENTAS = "51927000936"; 
        const ADMIN_EMAIL = "adders.ammh@gmail.com";

        const NOMBRES_MESES = {
            "01": "enero", "02": "febrero", "03": "marzo", "04": "abril",
            "05": "mayo", "06": "junio", "07": "julio", "08": "agosto",
            "09": "septiembre", "10": "octubre", "11": "noviembre", "12": "diciembre"
        };

        const BASE_EGRESOS = ["otros"];
        const BASE_INGRESOS = ["otros"];
        const PALETA_COLORES = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#ec4899', '#84cc16', '#f97316', '#6366f1'];

        const formatoMesEspanol = (codigo) => {
            if (codigo === "Consolidado Total") return codigo;
            try {
                const [anio, mes] = codigo.split("-");
                return `${NOMBRES_MESES[mes] || mes} ${anio}`;
            } catch {
                return codigo;
            }
        };

        const formatearMoneda = (num) => `S/ ${Number(num || 0).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        const capitalizar = (str) => (!str ? '' : str.charAt(0).toUpperCase() + str.slice(1).toLowerCase());

        const formatearFecha = (strFecha) => {
            if (!strFecha) return '-';
            try {
                const parte = strFecha.split('T')[0];
                const [anio, mes, dia] = parte.split('-');
                if (anio && mes && dia) {
                    return `${dia}-${mes}-${anio}`;
                }
                return parte;
            } catch {
                return strFecha;
            }
        };

        // Componente Icono SVG reutilizable
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                card: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />,
                plus: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />,
                sun: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />,
                moon: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />,
                refresh: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />,
                trendUp: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />,
                trendDown: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 17h8m0 0v-8m0 8l-8-8-4 4-6-6" />,
                wallet: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />,
                chevronDown: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" />,
                chevronUp: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 15l7-7 7 7" />,
                calendar: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />,
                search: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />,
                download: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />,
                filter: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />,
                flame: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343a7.975 7.975 0 010 11.314z" />,
                trash: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />,
                edit: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />,
                wifiOff: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 3l18 18M10.5 10.5a5 5 0 017.07 0M7 7a9 9 0 0112.73 0M1.4 1.4A13 13 0 0122.6 19.6M12 18h.01" />,
                chevronLeft: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7" />,
                chevronRight: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" />,
                mail: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />,
                lock: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />,
                logout: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />,
                user: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />,
                key: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />,
                users: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />,
                copy: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />,
                check: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />
            };
            return (
                <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    {icons[name] || null}
                </svg>
            );
        };

        function App() {
            // Tema visual Claro/Oscuro
            const [isDarkMode, setIsDarkMode] = useState(() => {
                const guardado = localStorage.getItem('app_theme');
                if (guardado) return guardado === 'dark';
                return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            });

            // Estado de Autenticación
            const [session, setSession] = useState(null);
            const [authCargando, setAuthCargando] = useState(true);
            const [authEmail, setAuthEmail] = useState('');
            const [authPassword, setAuthPassword] = useState('');
            const [authProcesando, setAuthProcesando] = useState(false);
            const [authError, setAuthError] = useState(null);

            // Modal para que el usuario gestione su cuenta y contraseña
            const [modalPasswordAbierto, setModalPasswordAbierto] = useState(false);
            const [passwordActual, setPasswordActual] = useState('');
            const [nuevaPassword, setNuevaPassword] = useState('');
            const [confirmarPassword, setConfirmarPassword] = useState('');
            const [cambiandoPassword, setCambiandoPassword] = useState(false);

            // Gestión de Clientes y Licencias (Exclusivo Administrador)
            const [clientes, setClientes] = useState([]);
            const [cargandoClientes, setCargandoClientes] = useState(false);
            const [nuevoClienteEmail, setNuevoClienteEmail] = useState('');
            const [nuevoClienteNombre, setNuevoClienteNombre] = useState('');
            const [nuevoClientePassword, setNuevoClientePassword] = useState('');
            const [creandoCliente, setCreandoCliente] = useState(false);

            const esAdmin = Boolean(session?.user?.email && session.user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase());

            // Datos principales
            const [movimientos, setMovimientos] = useState([]);
            const [cargando, setCargando] = useState(false);
            const [notificacion, setNotificacion] = useState(null);
            const [formAbierto, setFormAbierto] = useState(false);

            // Modo Edición
            const [editandoId, setEditandoId] = useState(null);

            // Estado de Conexión & Modo Offline
            const [estaOnline, setEstaOnline] = useState(() => typeof navigator !== 'undefined' && navigator.onLine !== false);
            const [modoOffline, setModoOffline] = useState(false);

            // Campos del formulario
            const [tipo, setTipo] = useState('Egreso');
            const [fecha, setFecha] = useState(() => new Date().toISOString().split('T')[0]);
            const [categoria, setCategoria] = useState('');
            const [monto, setMonto] = useState('');
            const [detalle, setDetalle] = useState('');
            const [periodoSeleccionado, setPeriodoSeleccionado] = useState('Consolidado Total');

            // Categorías personalizadas guardadas localmente por usuario
            const [categoriasPersonalizadas, setCategoriasPersonalizadas] = useState([]);
            const [creandoNuevaCat, setCreandoNuevaCat] = useState(false);
            const [nombreNuevaCat, setNombreNuevaCat] = useState('');

            // Segmentadores y filtros analíticos
            const [filtroTipo, setFiltroTipo] = useState('todos'); // 'todos' | 'egreso' | 'ingreso'
            const [filtroCategoria, setFiltroCategoria] = useState('todas');
            const [busquedaTexto, setBusquedaTexto] = useState('');

            // Paginación
            const [paginaActual, setPaginaActual] = useState(1);
            const [filasPorPagina, setFilasPorPagina] = useState(25);

            // Referencias para gráficos de Chart.js
            const canvasDonaRef = useRef(null);
            const canvasBarrasRef = useRef(null);
            const chartDonaInstance = useRef(null);
            const chartBarrasInstance = useRef(null);

            // Sincronizar clase darkMode en <html> y persistir en localStorage
            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('app_theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('app_theme', 'light');
                }
            }, [isDarkMode]);

            // Detección de conectividad en tiempo real
            useEffect(() => {
                const handleOnline = () => {
                    setEstaOnline(true);
                    setModoOffline(false);
                    mostrarAlerta('Conexión a internet restablecida. Sincronizando...');
                    if (session) cargarMovimientos();
                };
                const handleOffline = () => {
                    setEstaOnline(false);
                    setModoOffline(true);
                    mostrarAlerta('Sin conexión a internet. Funcionando en modo offline.', 'warning');
                };

                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, [session]);

            // Inicialización de la sesión de Supabase Auth
            useEffect(() => {
                if (!supabaseClient) {
                    setAuthCargando(false);
                    return;
                }

                supabaseClient.auth.getSession().then(({ data: { session } }) => {
                    setSession(session);
                    setAuthCargando(false);
                }).catch(() => {
                    setAuthCargando(false);
                });

                const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, newSession) => {
                    setSession(newSession);
                    setAuthCargando(false);
                });

                return () => subscription?.unsubscribe?.();
            }, []);

            // Carga de datos de Supabase estrictamente para el usuario autenticado
            const cargarMovimientos = async () => {
                if (!supabaseClient || !session?.user?.id) return;
                setCargando(true);
                try {
                    const { data, error } = await supabaseClient
                        .from('movimientos')
                        .select('*')
                        .eq('user_id', session.user.id)
                        .order('fecha', { ascending: false });

                    if (error) throw error;
                    const datos = data || [];
                    setMovimientos(datos);

                    // Guardar copia local segura indexada por el usuario
                    try {
                        localStorage.setItem(`app_cache_movimientos_${session.user.id}`, JSON.stringify(datos));
                    } catch (e) {
                        console.warn("No se pudo cachear en localStorage:", e);
                    }
                    setModoOffline(false);

                    // Seleccionar mes actual por defecto si existen datos
                    const mesActual = new Date().toISOString().slice(0, 7);
                    const meses = [...new Set(datos.map(d => d.fecha?.slice(0, 7)).filter(Boolean))];
                    if (meses.includes(mesActual) && periodoSeleccionado === 'Consolidado Total') {
                        setPeriodoSeleccionado(mesActual);
                    }
                } catch (err) {
                    // Fallback a localStorage si falla la conexión (offline) únicamente para este usuario
                    const claveUsuario = `app_cache_movimientos_${session?.user?.id}`;
                    const copiaLocal = session?.user?.id ? localStorage.getItem(claveUsuario) : null;
                    if (copiaLocal) {
                        try {
                            const datosLocales = JSON.parse(copiaLocal);
                            setMovimientos(datosLocales);
                            setModoOffline(true);
                            mostrarAlerta('Sin conexión: mostrando datos guardados en caché local', 'warning');
                        } catch {
                            mostrarAlerta(err.message, 'error');
                        }
                    } else {
                        setMovimientos([]);
                        mostrarAlerta(err.message || 'Error de conexión', 'error');
                    }
                } finally {
                    setCargando(false);
                }
            };

            // Cargar movimientos, categorías y clientes cuando la sesión esté disponible
            useEffect(() => {
                if (session?.user) {
                    cargarMovimientos();
                    if (esAdmin) {
                        cargarClientes();
                    }
                    try {
                        const keyStorage = `app_custom_categories_${session.user.id}`;
                        const guardadas = localStorage.getItem(keyStorage) || localStorage.getItem('app_custom_categories');
                        if (guardadas) {
                            setCategoriasPersonalizadas(JSON.parse(guardadas));
                        } else {
                            setCategoriasPersonalizadas([]);
                        }
                    } catch {
                        setCategoriasPersonalizadas([]);
                    }
                } else {
                    setCategoriasPersonalizadas([]);
                    setClientes([]);
                }
            }, [session?.user?.id, esAdmin]);

            const mostrarAlerta = (mensaje, tipo = 'success') => {
                setNotificacion({ mensaje, tipo });
                setTimeout(() => setNotificacion(null), 4000);
            };

            // Iniciar Sesión con Licencia Autorizada
            const manejarLogin = async (e) => {
                e.preventDefault();
                setAuthError(null);
                setAuthProcesando(true);

                try {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: authEmail.trim(),
                        password: authPassword
                    });

                    if (error) throw error;

                    setSession(data.session);
                    mostrarAlerta('¡Acceso verificado! Bienvenido a tu panel.');
                } catch (err) {
                    setAuthError("Credenciales no válidas o acceso no autorizado. Si acabas de adquirir tu licencia, verifica tu correo y contraseña.");
                } finally {
                    setAuthProcesando(false);
                }
            };

            // Cerrar Sesión
            const cerrarSesion = async () => {
                if (!window.confirm("¿Estás seguro de que deseas cerrar sesión?")) return;
                try {
                    await supabaseClient.auth.signOut();
                    setSession(null);
                    setMovimientos([]);
                    setClientes([]);
                    mostrarAlerta('Has cerrado sesión correctamente.');
                } catch (err) {
                    mostrarAlerta('Error al cerrar sesión', 'error');
                }
            };

            // Cerrar y limpiar modal de contraseña y gestión
            const cerrarModalPassword = () => {
                setModalPasswordAbierto(false);
                setPasswordActual('');
                setNuevaPassword('');
                setConfirmarPassword('');
                setNuevoClienteEmail('');
                setNuevoClienteNombre('');
                setNuevoClientePassword('');
            };

            // Cambiar contraseña por parte del usuario autenticado
            const manejarCambioPassword = async (e) => {
                e.preventDefault();
                if (!passwordActual) {
                    mostrarAlerta("Ingresa tu contraseña actual", "error");
                    return;
                }
                if (nuevaPassword.length < 6) {
                    mostrarAlerta("La nueva contraseña debe tener al menos 6 caracteres", "error");
                    return;
                }
                if (nuevaPassword !== confirmarPassword) {
                    mostrarAlerta("Las contraseñas no coinciden. Por favor verifícalas.", "error");
                    return;
                }

                setCambiandoPassword(true);
                try {
                    // Validar contraseña actual re-autenticando contra Supabase
                    const { error: errorVerif } = await supabaseClient.auth.signInWithPassword({
                        email: session.user.email,
                        password: passwordActual
                    });

                    if (errorVerif) {
                        throw new Error("La contraseña actual ingresada es incorrecta.");
                    }

                    const { error } = await supabaseClient.auth.updateUser({ password: nuevaPassword });
                    if (error) throw error;

                    mostrarAlerta("¡Tu contraseña ha sido actualizada con éxito!");
                    cerrarModalPassword();
                } catch (err) {
                    mostrarAlerta(err.message || "Error al actualizar contraseña", "error");
                } finally {
                    setCambiandoPassword(false);
                }
            };

            // Cargar lista de clientes para el administrador
            const cargarClientes = async () => {
                if (!supabaseClient || !session?.user?.email || !esAdmin) return;
                setCargandoClientes(true);
                try {
                    const { data, error } = await supabaseClient
                        .from('clientes')
                        .select('*')
                        .order('created_at', { ascending: false });

                    if (!error && data && data.length > 0) {
                        setClientes(data);
                        localStorage.setItem('app_clientes_admin', JSON.stringify(data));
                    } else {
                        const local = localStorage.getItem('app_clientes_admin');
                        if (local) setClientes(JSON.parse(local));
                    }
                } catch {
                    const local = localStorage.getItem('app_clientes_admin');
                    if (local) setClientes(JSON.parse(local));
                } finally {
                    setCargandoClientes(false);
                }
            };

            // Autorizar y crear un nuevo cliente con licencia
            const manejarAutorizarCliente = async (e) => {
                e.preventDefault();
                const emailLimpio = nuevoClienteEmail.trim().toLowerCase();
                const passLimpio = nuevoClientePassword.trim();
                const nombreLimpio = nuevoClienteNombre.trim() || 'Cliente';

                if (!emailLimpio || !passLimpio) {
                    mostrarAlerta("Por favor completa el correo y la contraseña inicial", "error");
                    return;
                }
                if (passLimpio.length < 6) {
                    mostrarAlerta("La contraseña inicial debe tener al menos 6 caracteres", "error");
                    return;
                }

                setCreandoCliente(true);
                try {
                    let creadoEnAuth = false;
                    let nuevoUserId = null;

                    // 1. Intentar crear vía función RPC en Postgres si está instalada en Supabase
                    try {
                        const { data: rpcData, error: rpcError } = await supabaseClient.rpc('autorizar_nuevo_cliente', {
                            p_email: emailLimpio,
                            p_password: passLimpio,
                            p_nombre: nombreLimpio
                        });

                        if (!rpcError && rpcData?.success) {
                            creadoEnAuth = true;
                            nuevoUserId = rpcData.user_id;
                        } else if (rpcError?.message?.includes('ya se encuentra registrado')) {
                            creadoEnAuth = true;
                            mostrarAlerta(`El usuario ya existía en Supabase y ha sido vinculado a tu lista.`);
                        }
                    } catch (rpcErr) {
                        console.log("RPC no disponible:", rpcErr);
                    }

                    // 2. Si no fue por RPC, intentar crear usuario vía Auth signUp aislado (sin tocar sesión del admin)
                    if (!creadoEnAuth) {
                        const authAdminClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
                            auth: {
                                persistSession: false,
                                autoRefreshToken: false,
                                detectSessionInUrl: false,
                                storage: {
                                    getItem: () => null,
                                    setItem: () => {},
                                    removeItem: () => {}
                                }
                            }
                        });

                        const { data: signUpData, error: signUpError } = await authAdminClient.auth.signUp({
                            email: emailLimpio,
                            password: passLimpio,
                            options: {
                                data: { nombre: nombreLimpio }
                            }
                        });

                        if (signUpError) {
                            if (signUpError.message?.toLowerCase().includes('already registered')) {
                                creadoEnAuth = true;
                                mostrarAlerta(`El usuario ya existía en el sistema y ha sido incorporado a tu lista.`);
                            } else if (signUpError.message?.includes('Signups not allowed') || signUpError.code === 'signup_disabled') {
                                throw new Error("Para autorizar clientes desde la app: en Supabase -> Authentication -> Providers -> Email activa 'Allow new users to sign up' (o ejecuta supabase_setup.sql en SQL Editor).");
                            } else {
                                throw signUpError;
                            }
                        } else {
                            nuevoUserId = signUpData?.user?.id;
                            creadoEnAuth = true;
                        }
                    }

                    // 3. Registrar el cliente en la tabla clientes de Supabase
                    const nuevoClienteObj = {
                        id: nuevoUserId || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
                        email: emailLimpio,
                        nombre: nombreLimpio,
                        created_at: new Date().toISOString(),
                        creado_por: session.user.id,
                        estado: 'activa'
                    };

                    try {
                        await supabaseClient.from('clientes').insert([nuevoClienteObj]);
                    } catch (errDb) {
                        console.warn("Tabla 'clientes' no accesible directamente:", errDb);
                    }

                    // Actualizar estado local y persistir en localStorage
                    const listaActualizada = [nuevoClienteObj, ...clientes.filter(c => c.email !== emailLimpio)];
                    setClientes(listaActualizada);
                    localStorage.setItem('app_clientes_admin', JSON.stringify(listaActualizada));

                    mostrarAlerta(`¡Cliente ${nombreLimpio} autorizado con éxito!`);
                    setNuevoClienteEmail('');
                    setNuevoClienteNombre('');
                    setNuevoClientePassword('');
                } catch (err) {
                    mostrarAlerta(err.message || "Error al autorizar cliente", "error");
                } finally {
                    setCreandoCliente(false);
                }
            };

            // Eliminar o desvincular un cliente de la lista de licencias
            const eliminarCliente = async (emailTarget) => {
                if (!window.confirm(`¿Deseas quitar a ${emailTarget} de la lista de clientes autorizados?`)) return;
                try {
                    await supabaseClient.from('clientes').delete().eq('email', emailTarget);
                } catch (e) {
                    console.warn(e);
                }
                const listaActualizada = clientes.filter(c => c.email !== emailTarget);
                setClientes(listaActualizada);
                localStorage.setItem('app_clientes_admin', JSON.stringify(listaActualizada));
                mostrarAlerta('Cliente retirado de la lista.');
            };

            // Categorías dinámicas (Base + Base de Datos + Personalizadas)
            const { categoriasEgreso, categoriasIngreso } = useMemo(() => {
                const dbEgreso = movimientos.filter(m => m.tipo?.toLowerCase() === 'egreso').map(m => m.categoria?.toLowerCase());
                const dbIngreso = movimientos.filter(m => m.tipo?.toLowerCase() === 'ingreso').map(m => m.categoria?.toLowerCase());
                const pers = categoriasPersonalizadas.map(c => c.toLowerCase());
                return {
                    categoriasEgreso: [...new Set([...BASE_EGRESOS, ...dbEgreso, ...pers])].filter(Boolean).map(capitalizar).sort(),
                    categoriasIngreso: [...new Set([...BASE_INGRESOS, ...dbIngreso, ...pers])].filter(Boolean).map(capitalizar).sort()
                };
            }, [movimientos, categoriasPersonalizadas]);

            // Asignar categoría inicial al cambiar de tipo solo si no se está editando
            useEffect(() => {
                if (!editandoId) {
                    if (tipo === 'Egreso') {
                        setCategoria(categoriasEgreso[0] || 'Otros');
                    } else {
                        setCategoria(categoriasIngreso[0] || 'Otros');
                    }
                }
            }, [tipo, categoriasEgreso, categoriasIngreso, editandoId]);

            // Periodos disponibles
            const listaPeriodos = useMemo(() => {
                const meses = movimientos.map(m => m.fecha?.slice(0, 7)).filter(Boolean);
                const unicos = Array.from(new Set(meses)).sort().reverse();
                return ['Consolidado Total', ...unicos];
            }, [movimientos]);

            // Lista consolidada de todas las categorías disponibles en el periodo
            const todasCategoriasPeriodo = useMemo(() => {
                const cats = new Set();
                movimientos.forEach(m => {
                    if (periodoSeleccionado === 'Consolidado Total' || m.fecha?.startsWith(periodoSeleccionado)) {
                        if (m.categoria) cats.add(capitalizar(m.categoria));
                    }
                });
                return ['todas', ...Array.from(cats).sort()];
            }, [movimientos, periodoSeleccionado]);

            // Filtrar y ordenar movimientos según el periodo y segmentadores adicionales
            const movimientosFiltrados = useMemo(() => {
                let resultado = periodoSeleccionado === 'Consolidado Total'
                    ? [...movimientos]
                    : movimientos.filter(m => m.fecha?.startsWith(periodoSeleccionado));

                // Filtro por tipo (todos / egreso / ingreso)
                if (filtroTipo !== 'todos') {
                    resultado = resultado.filter(m => m.tipo?.toLowerCase() === filtroTipo);
                }

                // Filtro por categoría específica
                if (filtroCategoria !== 'todas') {
                    resultado = resultado.filter(m => m.categoria?.toLowerCase() === filtroCategoria.toLowerCase());
                }

                // Buscador de texto en detalle o categoría
                if (busquedaTexto.trim()) {
                    const q = busquedaTexto.toLowerCase().trim();
                    resultado = resultado.filter(m => 
                        (m.detalle && m.detalle.toLowerCase().includes(q)) ||
                        (m.categoria && m.categoria.toLowerCase().includes(q))
                    );
                }

                return resultado.sort((a, b) => {
                    const fA = a.fecha ? a.fecha.split('T')[0] : '';
                    const fB = b.fecha ? b.fecha.split('T')[0] : '';
                    if (fA !== fB) {
                        return fB.localeCompare(fA);
                    }
                    if (b.id !== undefined && a.id !== undefined) {
                        const numA = Number(a.id);
                        const numB = Number(b.id);
                        if (!isNaN(numA) && !isNaN(numB)) return numB - numA;
                        return String(b.id).localeCompare(String(a.id));
                    }
                    if (b.created_at && a.created_at) {
                        return new Date(b.created_at) - new Date(a.created_at);
                    }
                    return 0;
                });
            }, [movimientos, periodoSeleccionado, filtroTipo, filtroCategoria, busquedaTexto]);

            // Reiniciar página actual al cambiar cualquier filtro
            useEffect(() => {
                setPaginaActual(1);
            }, [periodoSeleccionado, filtroTipo, filtroCategoria, busquedaTexto, filasPorPagina]);

            // Paginación calculada
            const totalMovimientos = movimientosFiltrados.length;
            const totalPaginas = filasPorPagina === 'todos' 
                ? 1 
                : Math.max(1, Math.ceil(totalMovimientos / Number(filasPorPagina)));

            const movimientosPaginados = useMemo(() => {
                if (filasPorPagina === 'todos') return movimientosFiltrados;
                const tamano = Number(filasPorPagina);
                const inicio = (paginaActual - 1) * tamano;
                return movimientosFiltrados.slice(inicio, inicio + tamano);
            }, [movimientosFiltrados, paginaActual, filasPorPagina]);

            const indiceInicio = totalMovimientos === 0 ? 0 : (paginaActual - 1) * (filasPorPagina === 'todos' ? totalMovimientos : Number(filasPorPagina)) + 1;
            const indiceFin = filasPorPagina === 'todos' ? totalMovimientos : Math.min(paginaActual * Number(filasPorPagina), totalMovimientos);

            // Totales e información de gráficos y KPIs extendidos
            const { ingresos, egresos, disponible, resumenCategorias, gastoPromedioDiario, mayorGasto, tasaAhorro } = useMemo(() => {
                let ing = 0;
                let egr = 0;
                const mapaCat = {};
                let maxGastoObj = null;
                const diasConGasto = new Set();

                const basePeriodo = periodoSeleccionado === 'Consolidado Total'
                    ? movimientos
                    : movimientos.filter(m => m.fecha?.startsWith(periodoSeleccionado));

                basePeriodo.forEach(m => {
                    const valor = parseFloat(m.monto) || 0;
                    const tipoNormal = m.tipo?.toLowerCase();
                    if (tipoNormal === 'ingreso') {
                        ing += valor;
                    } else if (tipoNormal === 'egreso') {
                        egr += valor;
                        const cat = capitalizar(m.categoria);
                        mapaCat[cat] = (mapaCat[cat] || 0) + valor;

                        if (m.fecha) diasConGasto.add(m.fecha.split('T')[0]);
                        if (!maxGastoObj || valor > maxGastoObj.monto) {
                            maxGastoObj = {
                                monto: valor,
                                categoria: cat,
                                detalle: m.detalle || '',
                                fecha: m.fecha
                            };
                        }
                    }
                });

                const resCat = Object.entries(mapaCat)
                    .map(([nombre, total]) => ({ nombre, total }))
                    .sort((a, b) => b.total - a.total);

                const totalDias = diasConGasto.size || 1;
                const promedioDiario = egr > 0 ? egr / totalDias : 0;
                const tasa = ing > 0 ? Math.max(0, ((ing - egr) / ing) * 100) : 0;

                return {
                    ingresos: ing,
                    egresos: egr,
                    disponible: ing - egr,
                    resumenCategorias: resCat,
                    gastoPromedioDiario: promedioDiario,
                    mayorGasto: maxGastoObj,
                    tasaAhorro: tasa
                };
            }, [movimientos, periodoSeleccionado]);

            // Exportar datos de la tabla a CSV
            const exportarCSV = () => {
                if (!movimientosFiltrados.length) return;
                const encabezados = ['Fecha', 'Tipo', 'Categoria', 'Detalle', 'Monto'];
                const filas = movimientosFiltrados.map(m => [
                    `"${formatearFecha(m.fecha)}"`,
                    `"${capitalizar(m.tipo)}"`,
                    `"${capitalizar(m.categoria)}"`,
                    `"${(m.detalle || '').replace(/"/g, '""')}"`,
                    m.monto
                ]);
                const contenidoCSV = [encabezados.join(','), ...filas.map(f => f.join(','))].join('\n');
                const blob = new Blob(['\uFEFF' + contenidoCSV], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `movimientos_${periodoSeleccionado}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // Iniciar Modo Edición
            const iniciarEdicion = (m) => {
                setEditandoId(m.id);
                setTipo(m.tipo ? capitalizar(m.tipo) : 'Egreso');
                setFecha(m.fecha ? m.fecha.split('T')[0] : new Date().toISOString().split('T')[0]);
                setCategoria(capitalizar(m.categoria));
                setMonto(String(m.monto || ''));
                setDetalle(m.detalle || '');
                setFormAbierto(true);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // Cancelar Modo Edición
            const cancelarEdicion = () => {
                setEditandoId(null);
                setMonto('');
                setDetalle('');
                setFormAbierto(false);
            };

            // Guardar o Actualizar un movimiento en Supabase
            const manejarEnvio = async (e) => {
                e.preventDefault();
                const montoNumerico = parseFloat(monto);
                if (isNaN(montoNumerico) || montoNumerico <= 0) {
                    mostrarAlerta('El monto debe ser mayor a 0', 'error');
                    return;
                }

                const payload = {
                    fecha,
                    tipo,
                    categoria: categoria.trim(),
                    detalle: detalle.trim(),
                    monto: montoNumerico,
                    user_id: session?.user?.id
                };

                try {
                    if (editandoId) {
                        // Actualización con Supabase Client
                        const { error } = await supabaseClient
                            .from('movimientos')
                            .update(payload)
                            .eq('id', editandoId)
                            .eq('user_id', session?.user?.id);

                        if (error) throw error;
                        mostrarAlerta('¡Movimiento actualizado con éxito!');
                        cancelarEdicion();
                    } else {
                        // Inserción con Supabase Client
                        const { error } = await supabaseClient
                            .from('movimientos')
                            .insert([payload]);

                        if (error) throw error;
                        mostrarAlerta('¡Movimiento guardado con éxito!');
                        setMonto('');
                        setDetalle('');
                        setFormAbierto(false);
                    }
                    cargarMovimientos();
                } catch (err) {
                    mostrarAlerta(err.message || 'Error al guardar movimiento', 'error');
                }
            };

            // Eliminar un registro en Supabase
            const eliminarMovimiento = async (id) => {
                const confirmado = window.confirm("¿Estás seguro de que deseas eliminar este movimiento de forma permanente?");
                if (!confirmado) return;

                try {
                    const { error } = await supabaseClient
                        .from('movimientos')
                        .delete()
                        .eq('id', id)
                        .eq('user_id', session?.user?.id);

                    if (error) throw error;

                    if (editandoId === id) {
                        cancelarEdicion();
                    }

                    mostrarAlerta('Registro eliminado correctamente');
                    cargarMovimientos();
                } catch (err) {
                    mostrarAlerta(err.message || 'Error al eliminar registro', 'error');
                }
            };

            // Agregar nueva categoría personalizada
            const agregarNuevaCategoria = (e) => {
                e.preventDefault();
                const limpio = nombreNuevaCat.trim();
                if (!limpio) return;
                const formateado = capitalizar(limpio);
                const listaActual = tipo === 'Egreso' ? categoriasEgreso : categoriasIngreso;
                if (listaActual.includes(formateado)) {
                    setCategoria(formateado);
                    setNombreNuevaCat('');
                    setCreandoNuevaCat(false);
                    mostrarAlerta(`La categoría "${formateado}" ya existe y fue seleccionada.`);
                    return;
                }
                const nuevas = [...categoriasPersonalizadas, formateado];
                setCategoriasPersonalizadas(nuevas);
                try {
                    const keyStorage = session?.user?.id ? `app_custom_categories_${session.user.id}` : 'app_custom_categories';
                    localStorage.setItem(keyStorage, JSON.stringify(nuevas));
                } catch (err) {
                    console.warn(err);
                }
                setCategoria(formateado);
                setNombreNuevaCat('');
                setCreandoNuevaCat(false);
                mostrarAlerta(`¡Categoría "${formateado}" agregada!`);
            };

            // Renderizado de gráficos con Chart.js
            useEffect(() => {
                if (!session) return;
                const colorTexto = isDarkMode ? '#94a3b8' : '#64748b';
                const colorBorde = isDarkMode ? '#1e293b' : '#ffffff';
                const colorGrid = isDarkMode ? 'rgba(51, 65, 85, 0.4)' : 'rgba(226, 232, 240, 0.8)';

                if (window.ChartDataLabels && Chart.registry && !Chart.registry.plugins.get('datalabels')) {
                    Chart.register(ChartDataLabels);
                }

                // Gráfico de Dona
                if (canvasDonaRef.current && resumenCategorias.length > 0) {
                    if (chartDonaInstance.current) chartDonaInstance.current.destroy();

                    chartDonaInstance.current = new Chart(canvasDonaRef.current, {
                        type: 'doughnut',
                        data: {
                            labels: resumenCategorias.map(c => c.nombre),
                            datasets: [{
                                data: resumenCategorias.map(c => c.total),
                                backgroundColor: PALETA_COLORES,
                                borderWidth: 2,
                                borderColor: colorBorde
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: { color: colorTexto, boxWidth: 12, padding: 12, font: { family: 'Plus Jakarta Sans', size: 11, weight: '500' } }
                                },
                                tooltip: {
                                    callbacks: {
                                        label: (context) => ` ${context.label}: S/ ${Number(context.raw).toLocaleString('es-PE', { minimumFractionDigits: 2 })}`
                                    }
                                },
                                datalabels: {
                                    color: '#ffffff',
                                    font: { family: 'Plus Jakarta Sans', size: 11, weight: 'bold' },
                                    formatter: (value, ctx) => {
                                        const total = ctx.dataset.data.reduce((acc, curr) => acc + curr, 0);
                                        const pct = total > 0 ? (value / total) * 100 : 0;
                                        return pct >= 4 ? `${pct.toFixed(1)}%` : '';
                                    }
                                }
                            },
                            cutout: '58%'
                        }
                    });
                }

                // Gráfico de Barras
                if (canvasBarrasRef.current && resumenCategorias.length > 0) {
                    if (chartBarrasInstance.current) chartBarrasInstance.current.destroy();

                    chartBarrasInstance.current = new Chart(canvasBarrasRef.current, {
                        type: 'bar',
                        data: {
                            labels: resumenCategorias.map(c => c.nombre),
                            datasets: [{
                                label: 'Monto (S/.)',
                                data: resumenCategorias.map(c => c.total),
                                backgroundColor: PALETA_COLORES.slice(0, resumenCategorias.length),
                                borderRadius: 8
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            layout: {
                                padding: { top: 25 }
                            },
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    callbacks: {
                                        label: (context) => ` Total: S/ ${Number(context.raw).toLocaleString('es-PE', { minimumFractionDigits: 2 })}`
                                    }
                                },
                                datalabels: {
                                    anchor: 'end',
                                    align: 'top',
                                    offset: 2,
                                    color: colorTexto,
                                    font: { family: 'Plus Jakarta Sans', size: 10, weight: 'bold' },
                                    formatter: (value) => Number(value).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
                                }
                            },
                            scales: {
                                x: {
                                    grid: { display: false },
                                    ticks: { color: colorTexto, font: { family: 'Plus Jakarta Sans', size: 11 } }
                                },
                                y: {
                                    grace: '15%',
                                    grid: { color: colorGrid },
                                    ticks: {
                                        color: colorTexto,
                                        font: { family: 'Plus Jakarta Sans', size: 11 },
                                        callback: (v) => `S/ ${v}`
                                    }
                                }
                            }
                        }
                    });
                }

                return () => {
                    if (chartDonaInstance.current) chartDonaInstance.current.destroy();
                    if (chartBarrasInstance.current) chartBarrasInstance.current.destroy();
                };
            }, [resumenCategorias, isDarkMode, session]);

            const porcentajeConsumido = ingresos > 0 ? Math.min((egresos / ingresos) * 100, 100) : (egresos > 0 ? 100 : 0);

            // Pantalla de Carga de Autenticación
            if (authCargando) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-50 dark:bg-slate-950">
                        <div className="flex flex-col items-center space-y-4">
                            <div className="w-16 h-16 rounded-2xl overflow-hidden shadow-xl shadow-blue-500/25 border border-slate-700/40 animate-bounce">
                                <img src="icons/icon-192.png" alt="Logo" className="w-full h-full object-cover" />
                            </div>
                            <p className="text-sm font-semibold text-slate-500 dark:text-slate-400 animate-pulse">Verificando licencia de acceso...</p>
                        </div>
                    </div>
                );
            }

            // PANTALLA DE ACCESO CON LICENCIA EXCLUSIVA (Login privado)
            if (!session) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 sm:p-6 bg-slate-50 dark:bg-slate-950 relative overflow-hidden transition-colors duration-300">
                        {/* Decoración ambiental */}
                        <div className="absolute top-[-10%] right-[-10%] w-96 h-96 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
                        <div className="absolute bottom-[-10%] left-[-10%] w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

                        {/* Botón Alternador Tema */}
                        <div className="absolute top-5 right-5">
                            <button
                                onClick={() => setIsDarkMode(!isDarkMode)}
                                className="w-10 h-10 rounded-xl bg-white dark:bg-slate-900 shadow-sm border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center transition active:scale-95"
                                title="Cambiar tema"
                            >
                                <Icon name={isDarkMode ? "sun" : "moon"} className="w-5 h-5 text-amber-500" />
                            </button>
                        </div>

                        <div className="w-full max-w-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 rounded-3xl p-6 sm:p-8 shadow-xl shadow-slate-200/50 dark:shadow-none space-y-6 relative z-10 transition-colors">
                            {/* Logo y Encabezado Comercial */}
                            <div className="text-center space-y-2">
                                <div className="inline-flex w-16 h-16 rounded-2xl overflow-hidden shadow-lg shadow-blue-500/20 mb-1 border border-slate-200 dark:border-slate-800">
                                    <img src="icons/icon-192.png" alt="Logo" className="w-full h-full object-cover" />
                                </div>
                                <h1 className="text-2xl font-extrabold tracking-tight text-slate-800 dark:text-slate-100">
                                    Mi Control Financiero
                                </h1>
                                <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400 font-medium">
                                    Acceso Privado para Usuarios Autorizados
                                </p>
                            </div>

                                <div className="flex items-center gap-3">
                                    <span>
                                        Mostrando <b className="text-slate-700 dark:text-slate-200">{indiceInicio}</b> - <b className="text-slate-700 dark:text-slate-200">{indiceFin}</b> de <b className="text-slate-700 dark:text-slate-200">{totalMovimientos}</b>
                                    </span>
                                    <div className="flex items-center space-x-1.5 pl-2 border-l border-slate-200 dark:border-slate-700">
                                        <span>Filas:</span>
                                        <select
                                            value={filasPorPagina}
                                            onChange={(e) => {
                                                setFilasPorPagina(e.target.value === 'todos' ? 'todos' : Number(e.target.value));
                                                setPaginaActual(1);
                                            }}
                                            className="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-none rounded-lg px-2 py-1 focus:ring-2 focus:ring-blue-500 cursor-pointer"
                                        >
                                            <option value="15">15</option>
                                            <option value="25">25</option>
                                            <option value="50">50</option>
                                            <option value="100">100</option>
                                            <option value="todos">Todos</option>
                                        </select>
                                    </div>
                                </div>

                                {filasPorPagina !== 'todos' && totalPaginas > 1 && (
                                    <div className="flex items-center space-x-2">
                                        <button
                                            onClick={() => setPaginaActual(p => Math.max(1, p - 1))}
                                            disabled={paginaActual === 1}
                                            className="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-50 dark:hover:bg-slate-800 transition flex items-center justify-center"
                                            title="Página anterior"
                                        >
                                            <Icon name="chevronLeft" className="w-4 h-4" />
                                        </button>
                                        <span className="px-2">
                                            Página <b className="text-slate-800 dark:text-slate-100">{paginaActual}</b> de <b className="text-slate-800 dark:text-slate-100">{totalPaginas}</b>
                                        </span>
                                        <button
                                            onClick={() => setPaginaActual(p => Math.min(totalPaginas, p + 1))}
                                            disabled={paginaActual >= totalPaginas}
                                            className="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-50 dark:hover:bg-slate-800 transition flex items-center justify-center"
                                            title="Página siguiente"
                                        >
                                            <Icon name="chevronRight" className="w-4 h-4" />
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </section>

                </div>
            );
        }

        // Montar la aplicación
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);

        // Registro de Service Worker para PWA y modo Offline
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then((reg) => {
                    console.log('Service Worker registrado:', reg.scope);
                }).catch((err) => {
                    console.log('Aviso al registrar Service Worker:', err);
                });
            });
        }
    </script>
</body>
</html>
