<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Control Financiero</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='20' height='14' x='2' y='5' rx='2'/%3E%3Cline x1='2' x2='22' y1='10' y2='10'/%3E%3C/svg%3E">

    <!-- Tailwind CSS con soporte para modo oscuro por clase -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8'
                        }
                    }
                }
            }
        }
    </script>

    <!-- React 18 UMD & Babel Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Chart.js para visualizaciones nativas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(148, 163, 184, 0.4);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen antialiased transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // Configuración de Supabase
        const SUPABASE_URL = "https://uylnumfofwykwjamwtwk.supabase.co";
        const SUPABASE_KEY = "sb_publishable_-F-3L3EmsN2DGdQ3xLvKgQ_0_DFq1CY";

        const NOMBRES_MESES = {
            "01": "enero", "02": "febrero", "03": "marzo", "04": "abril",
            "05": "mayo", "06": "junio", "07": "julio", "08": "agosto",
            "09": "septiembre", "10": "octubre", "11": "noviembre", "12": "diciembre"
        };

        const BASE_EGRESOS = ["ana", "casa", "comida", "cuotas", "educación", "gustos", "movilidad", "padres", "salud", "trabajo", "vestimenta", "otros"];
        const BASE_INGRESOS = ["sunass", "cas", "gratificación", "cobro de deuda", "otros"];
        const PALETA_COLORES = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#ec4899', '#84cc16', '#f97316', '#6366f1'];

        const formatoMesEspanol = (codigo) => {
            if (codigo === "Consolidado Total") return codigo;
            try {
                const [anio, mes] = codigo.split("-");
                return `${NOMBRES_MESES[mes] || mes} ${anio}`;
            } catch {
                return codigo;
            }
        };

        const formatearMoneda = (num) => `S/ ${Number(num || 0).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        const capitalizar = (str) => (!str ? '' : str.charAt(0).toUpperCase() + str.slice(1).toLowerCase());

        // Componente Icono SVG reutilizable
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                card: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />,
                plus: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />,
                sun: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />,
                moon: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />,
                refresh: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />,
                trendUp: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />,
                trendDown: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 17h8m0 0v-8m0 8l-8-8-4 4-6-6" />,
                wallet: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />,
                chevronDown: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" />,
                chevronUp: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 15l7-7 7 7" />,
                calendar: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            };
            return (
                <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    {icons[name] || null}
                </svg>
            );
        };

        function App() {
            const [isDarkMode, setIsDarkMode] = useState(() => {
                const guardado = localStorage.getItem('app_theme');
                if (guardado) return guardado === 'dark';
                return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            });

            const [movimientos, setMovimientos] = useState([]);
            const [cargando, setCargando] = useState(true);
            const [notificacion, setNotificacion] = useState(null);
            const [formAbierto, setFormAbierto] = useState(false);

            // Campos del formulario
            const [tipo, setTipo] = useState('Egreso');
            const [fecha, setFecha] = useState(() => new Date().toISOString().split('T')[0]);
            const [categoria, setCategoria] = useState('');
            const [monto, setMonto] = useState('');
            const [detalle, setDetalle] = useState('');
            const [periodoSeleccionado, setPeriodoSeleccionado] = useState('Consolidado Total');

            // Referencias para gráficos de Chart.js
            const canvasDonaRef = useRef(null);
            const canvasBarrasRef = useRef(null);
            const chartDonaInstance = useRef(null);
            const chartBarrasInstance = useRef(null);

            // Sincronizar clase darkMode en <html> y persistir en localStorage
            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('app_theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('app_theme', 'light');
                }
            }, [isDarkMode]);

            // Carga de datos directa a Supabase
            const cargarMovimientos = async () => {
                setCargando(true);
                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/movimientos?select=*&order=fecha.desc`, {
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        }
                    });
                    if (!res.ok) throw new Error("Error en la conexión con Supabase");
                    const datos = await res.json();
                    setMovimientos(datos);

                    // Seleccionar mes actual por defecto si existen datos
                    const mesActual = new Date().toISOString().slice(0, 7);
                    const meses = [...new Set(datos.map(d => d.fecha?.slice(0, 7)).filter(Boolean))];
                    if (meses.includes(mesActual) && periodoSeleccionado === 'Consolidado Total') {
                        setPeriodoSeleccionado(mesActual);
                    }
                } catch (err) {
                    mostrarAlerta(err.message, 'error');
                } finally {
                    setCargando(false);
                }
            };

            useEffect(() => {
                cargarMovimientos();
            }, []);

            const mostrarAlerta = (mensaje, tipo = 'success') => {
                setNotificacion({ mensaje, tipo });
                setTimeout(() => setNotificacion(null), 4000);
            };

            // Categorías dinámicas
            const { categoriasEgreso, categoriasIngreso } = useMemo(() => {
                const dbEgreso = movimientos.filter(m => m.tipo?.toLowerCase() === 'egreso').map(m => m.categoria?.toLowerCase());
                const dbIngreso = movimientos.filter(m => m.tipo?.toLowerCase() === 'ingreso').map(m => m.categoria?.toLowerCase());
                return {
                    categoriasEgreso: [...new Set([...BASE_EGRESOS, ...dbEgreso])].filter(Boolean).map(capitalizar).sort(),
                    categoriasIngreso: [...new Set([...BASE_INGRESOS, ...dbIngreso])].filter(Boolean).map(capitalizar).sort()
                };
            }, [movimientos]);

            useEffect(() => {
                if (tipo === 'Egreso') {
                    setCategoria(categoriasEgreso[0] || 'Comida');
                } else {
                    setCategoria(categoriasIngreso[0] || 'Sueldo');
                }
            }, [tipo, categoriasEgreso, categoriasIngreso]);

            // Periodos disponibles
            const listaPeriodos = useMemo(() => {
                const meses = movimientos.map(m => m.fecha?.slice(0, 7)).filter(Boolean);
                const unicos = Array.from(new Set(meses)).sort().reverse();
                return ['Consolidado Total', ...unicos];
            }, [movimientos]);

            // Filtrar movimientos según el periodo
            const movimientosFiltrados = useMemo(() => {
                if (periodoSeleccionado === 'Consolidado Total') return movimientos;
                return movimientos.filter(m => m.fecha?.startsWith(periodoSeleccionado));
            }, [movimientos, periodoSeleccionado]);

            // Totales e información de gráficos
            const { ingresos, egresos, disponible, resumenCategorias } = useMemo(() => {
                let ing = 0;
                let egr = 0;
                const mapaCat = {};

                movimientosFiltrados.forEach(m => {
                    const valor = parseFloat(m.monto) || 0;
                    const tipoNormal = m.tipo?.toLowerCase();
                    if (tipoNormal === 'ingreso') {
                        ing += valor;
                    } else if (tipoNormal === 'egreso') {
                        egr += valor;
                        const cat = capitalizar(m.categoria);
                        mapaCat[cat] = (mapaCat[cat] || 0) + valor;
                    }
                });

                const resCat = Object.entries(mapaCat)
                    .map(([nombre, total]) => ({ nombre, total }))
                    .sort((a, b) => b.total - a.total);

                return {
                    ingresos: ing,
                    egresos: egr,
                    disponible: ing - egr,
                    resumenCategorias: resCat
                };
            }, [movimientosFiltrados]);

            // Guardar un nuevo movimiento en Supabase
            const manejarEnvio = async (e) => {
                e.preventDefault();
                const montoNumerico = parseFloat(monto);
                if (isNaN(montoNumerico) || montoNumerico <= 0) {
                    mostrarAlerta('El monto debe ser mayor a 0', 'error');
                    return;
                }

                const nuevoRegistro = {
                    fecha,
                    tipo,
                    categoria,
                    detalle: detalle.trim(),
                    monto: montoNumerico
                };

                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/movimientos`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=representation'
                        },
                        body: JSON.stringify(nuevoRegistro)
                    });

                    if (!res.ok) throw new Error("Error al registrar el movimiento en la nube");

                    mostrarAlerta('¡Movimiento guardado con éxito!');
                    setMonto('');
                    setDetalle('');
                    setFormAbierto(false);
                    cargarMovimientos();
                } catch (err) {
                    mostrarAlerta(err.message, 'error');
                }
            };

            useEffect(() => {
                const colorTexto = isDarkMode ? '#94a3b8' : '#64748b';
                const colorBorde = isDarkMode ? '#1e293b' : '#ffffff';
                const colorGrid = isDarkMode ? 'rgba(51, 65, 85, 0.4)' : 'rgba(226, 232, 240, 0.8)';

                // Gráfico de Dona
                if (canvasDonaRef.current && resumenCategorias.length > 0) {
                    if (chartDonaInstance.current) chartDonaInstance.current.destroy();

                    chartDonaInstance.current = new Chart(canvasDonaRef.current, {
                        type: 'doughnut',
                        data: {
                            labels: resumenCategorias.map(c => c.nombre),
                            datasets: [{
                                data: resumenCategorias.map(c => c.total),
                                backgroundColor: PALETA_COLORES,
                                borderWidth: 2,
                                borderColor: colorBorde
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: { color: colorTexto, boxWidth: 12, padding: 12, font: { family: 'Plus Jakarta Sans', size: 11, weight: '500' } }
                                },
                                tooltip: {
                                    callbacks: {
                                        label: (context) => ` ${context.label}: S/ ${Number(context.raw).toLocaleString('es-PE', { minimumFractionDigits: 2 })}`
                                    }
                                }
                            },
                            cutout: '65%'
                        }
                    });
                }

                // Gráfico de Barras
                if (canvasBarrasRef.current && resumenCategorias.length > 0) {
                    if (chartBarrasInstance.current) chartBarrasInstance.current.destroy();

                    chartBarrasInstance.current = new Chart(canvasBarrasRef.current, {
                        type: 'bar',
                        data: {
                            labels: resumenCategorias.map(c => c.nombre),
                            datasets: [{
                                label: 'Monto (S/.)',
                                data: resumenCategorias.map(c => c.total),
                                backgroundColor: PALETA_COLORES.slice(0, resumenCategorias.length),
                                borderRadius: 8
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    callbacks: {
                                        label: (context) => ` Total: S/ ${Number(context.raw).toLocaleString('es-PE', { minimumFractionDigits: 2 })}`
                                    }
                                }
                            },
                            scales: {
                                x: {
                                    grid: { display: false },
                                    ticks: { color: colorTexto, font: { family: 'Plus Jakarta Sans', size: 11 } }
                                },
                                y: {
                                    grid: { color: colorGrid },
                                    ticks: {
                                        color: colorTexto,
                                        font: { family: 'Plus Jakarta Sans', size: 11 },
                                        callback: (v) => `S/ ${v}`
                                    }
                                }
                            }
                        }
                    });
                }

                return () => {
                    if (chartDonaInstance.current) chartDonaInstance.current.destroy();
                    if (chartBarrasInstance.current) chartBarrasInstance.current.destroy();
                };
            }, [resumenCategorias, isDarkMode]);

            const porcentajeConsumido = ingresos > 0 ? Math.min((egresos / ingresos) * 100, 100) : (egresos > 0 ? 100 : 0);

            return (
                <div className="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-10 space-y-6">
                    
                    {/* Header Principal */}
                    <header className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 rounded-2xl p-5 sm:p-6 shadow-sm flex items-center justify-between transition-colors duration-300">
                        <div className="flex items-center space-x-3.5">
                            <div className="w-12 h-12 rounded-xl bg-blue-50 dark:bg-blue-950/60 border border-blue-100 dark:border-blue-900/40 text-blue-600 dark:text-blue-400 flex items-center justify-center text-xl shadow-inner">
                                <Icon name="card" className="w-6 h-6" />
                            </div>
                            <div>
                                <h1 className="text-xl sm:text-2xl font-bold tracking-tight text-slate-800 dark:text-slate-100">Mi Control Financiero</h1>
                                <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400 font-medium">Gestión sincronizada con Supabase</p>
                            </div>
                        </div>

                        <div className="flex items-center space-x-2">
                            {/* Botón Alternador Tema */}
                            <button
                                onClick={() => setIsDarkMode(!isDarkMode)}
                                className="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center transition active:scale-95 border border-slate-200/50 dark:border-slate-700/50"
                                title="Cambiar tema (Claro/Oscuro)"
                            >
                                <Icon name={isDarkMode ? "sun" : "moon"} className="w-5 h-5 text-amber-500 dark:text-amber-400" />
                            </button>

                            {/* Botón Recargar */}
                            <button
                                onClick={cargarMovimientos}
                                className={`w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center transition active:scale-95 border border-slate-200/50 dark:border-slate-700/50 ${cargando ? 'animate-spin text-blue-600' : ''}`}
                                title="Recargar datos"
                            >
                                <Icon name="refresh" className="w-5 h-5" />
                            </button>
                        </div>
                    </header>

                    {/* Alertas */}
                    {notificacion && (
                        <div className={`p-4 rounded-xl text-sm font-semibold border flex items-center justify-between transition-all duration-300 ${
                            notificacion.tipo === 'error'
                                ? 'bg-rose-50 dark:bg-rose-950/40 text-rose-700 dark:text-rose-300 border-rose-200 dark:border-rose-900/50'
                                : 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-900/50'
                        }`}>
                            <span>{notificacion.mensaje}</span>
                            <button onClick={() => setNotificacion(null)} className="text-xs uppercase font-bold opacity-60 hover:opacity-100">Cerrar</button>
                        </div>
                    )}

                    {/* Formulario Expandible */}
                    <section className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 rounded-2xl shadow-sm overflow-hidden transition-colors duration-300">
                        <button
                            onClick={() => setFormAbierto(!formAbierto)}
                            className="w-full p-5 flex items-center justify-between text-left font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors"
                        >
                            <div className="flex items-center space-x-2.5">
                                <span className="p-1.5 rounded-lg bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-400">
                                    <Icon name="plus" className="w-4 h-4" />
                                </span>
                                <span>Ingresar Nuevo Movimiento</span>
                            </div>
                            <Icon name={formAbierto ? "chevronUp" : "chevronDown"} className="w-5 h-5 text-slate-400" />
                        </button>

                        {formAbierto && (
                            <form onSubmit={manejarEnvio} className="p-5 sm:p-6 border-t border-slate-100 dark:border-slate-800 space-y-5">
                                <div className="grid grid-cols-2 gap-3 p-1 bg-slate-100 dark:bg-slate-800 rounded-xl">
                                    <button
                                        type="button"
                                        onClick={() => setTipo('Egreso')}
                                        className={`py-2 text-sm font-semibold rounded-lg flex items-center justify-center space-x-2 transition ${
                                            tipo === 'Egreso' ? 'bg-white dark:bg-slate-900 text-rose-600 dark:text-rose-400 shadow-sm' : 'text-slate-500 hover:text-slate-700 dark:text-slate-400'
                                        }`}
                                    >
                                        <Icon name="trendDown" className="w-4 h-4" />
                                        <span>Egreso</span>
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setTipo('Ingreso')}
                                        className={`py-2 text-sm font-semibold rounded-lg flex items-center justify-center space-x-2 transition ${
                                            tipo === 'Ingreso' ? 'bg-white dark:bg-slate-900 text-emerald-600 dark:text-emerald-400 shadow-sm' : 'text-slate-500 hover:text-slate-700 dark:text-slate-400'
                                        }`}
                                    >
                                        <Icon name="trendUp" className="w-4 h-4" />
                                        <span>Ingreso</span>
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-1">Fecha</label>
                                        <input
                                            type="date"
                                            value={fecha}
                                            onChange={(e) => setFecha(e.target.value)}
                                            required
                                            className="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-slate-100 transition"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-1">Categoría</label>
                                        <select
                                            value={categoria}
                                            onChange={(e) => setCategoria(e.target.value)}
                                            className="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-slate-100 transition"
                                        >
                                            {(tipo === 'Egreso' ? categoriasEgreso : categoriasIngreso).map(c => (
                                                <option key={c} value={c}>{c}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-1">Monto (S/.)</label>
                                        <input
                                            type="number"
                                            step="0.01"
                                            min="0.01"
                                            value={monto}
                                            onChange={(e) => setMonto(e.target.value)}
                                            placeholder="0.00"
                                            required
                                            className="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-slate-100 transition"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-1">Detalle</label>
                                        <input
                                            type="text"
                                            value={detalle}
                                            onChange={(e) => setDetalle(e.target.value)}
                                            placeholder="Ej. Menú, cuota, pasajes..."
                                            className="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-slate-100 transition"
                                        />
                                    </div>
                                </div>

                                <div className="flex justify-end pt-2">
                                    <button
                                        type="submit"
                                        className="w-full sm:w-auto px-6 py-2.5 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-semibold rounded-xl text-sm shadow-sm transition"
                                    >
                                        Guardar en el acto
                                    </button>
                                </div>
                            </form>
                        )}
                    </section>

                    {/* Selector de Periodo */}
                    <section className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 rounded-2xl p-4 sm:p-5 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-3 transition-colors duration-300">
                        <div className="flex items-center space-x-2 text-slate-700 dark:text-slate-200 font-semibold text-sm w-full sm:w-auto">
                            <Icon name="calendar" className="w-5 h-5 text-blue-600 dark:text-blue-400" />
                            <span>Periodo de Análisis:</span>
                        </div>
                        <select
                            value={periodoSeleccionado}
                            onChange={(e) => setPeriodoSeleccionado(e.target.value)}
                            className="w-full sm:w-64 px-3.5 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-semibold text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                        >
                            {listaPeriodos.map(p => (
                                <option key={p} value={p}>{formatoMesEspanol(p)}</option>
                            ))}
                        </select>
                    </section>

                    {/* KPIs Principales */}
                    <section className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 p-5 rounded-2xl shadow-sm flex items-center justify-between transition-colors">
                            <div>
                                <p className="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-1">Ingresos</p>
                                <p className="text-2xl font-extrabold text-emerald-600 dark:text-emerald-400">{formatearMoneda(ingresos)}</p>
                            </div>
                            <div className="w-12 h-12 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 flex items-center justify-center">
                                <Icon name="trendUp" className="w-6 h-6" />
                            </div>
                        </div>

                        <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 p-5 rounded-2xl shadow-sm flex items-center justify-between transition-colors">
                            <div>
                                <p className="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-1">Egresos</p>
                                <p className="text-2xl font-extrabold text-rose-600 dark:text-rose-400">{formatearMoneda(egresos)}</p>
                            </div>
                            <div className="w-12 h-12 rounded-xl bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 flex items-center justify-center">
                                <Icon name="trendDown" className="w-6 h-6" />
                            </div>
                        </div>

                        <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 p-5 rounded-2xl shadow-sm flex items-center justify-between transition-colors">
                            <div>
                                <p className="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-1">Disponible</p>
                                <p className={`text-2xl font-extrabold ${disponible >= 0 ? 'text-blue-600 dark:text-blue-400' : 'text-rose-600 dark:text-rose-400'}`}>
                                    {formatearMoneda(disponible)}
                                </p>
                            </div>
                            <div className="w-12 h-12 rounded-xl bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 flex items-center justify-center">
                                <Icon name="wallet" className="w-6 h-6" />
                            </div>
                        </div>
                    </section>

                    {/* Gráficos */}
                    {egresos > 0 && (
                        <div className="space-y-6">
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                {/* Dona */}
                                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 p-5 sm:p-6 rounded-2xl shadow-sm transition-colors">
                                    <h2 className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-4 text-center">Egresos por Categoría</h2>
                                    <div className="relative h-64 w-full">
                                        <canvas ref={canvasDonaRef}></canvas>
                                    </div>
                                </div>

                                {/* Barra Medidora Consumo */}
                                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 p-5 sm:p-6 rounded-2xl shadow-sm flex flex-col justify-center transition-colors">
                                    <h2 className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-6 text-center">Egresos vs Ingresos</h2>
                                    <div className="w-full max-w-sm mx-auto space-y-4">
                                        <div className="flex justify-between text-xs font-semibold text-slate-500 dark:text-slate-400">
                                            <span>Egresos: {formatearMoneda(egresos)}</span>
                                            <span>Ingresos: {formatearMoneda(ingresos)}</span>
                                        </div>
                                        <div className="w-full h-4 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden shadow-inner p-0.5">
                                            <div
                                                className={`h-full rounded-full transition-all duration-700 ${egresos > ingresos ? 'bg-rose-500' : 'bg-blue-600'}`}
                                                style={{ width: `${porcentajeConsumido}%` }}
                                            ></div>
                                        </div>
                                        <p className="text-center text-xs font-bold text-slate-500 dark:text-slate-400">
                                            {porcentajeConsumido.toFixed(1)}% Consumido
                                        </p>
                                    </div>
                                </div>
                            </div>

                            {/* Barras por Categoría */}
                            <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 p-5 sm:p-6 rounded-2xl shadow-sm transition-colors">
                                <h2 className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-4">Total de Egresos por Categoría</h2>
                                <div className="relative h-64 w-full">
                                    <canvas ref={canvasBarrasRef}></canvas>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Tabla de Movimientos */}
                    <section className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 rounded-2xl shadow-sm overflow-hidden transition-colors">
                        <div className="p-5 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center">
                            <h2 className="text-sm font-bold text-slate-800 dark:text-slate-200 uppercase tracking-wider">Movimientos del Periodo</h2>
                            <span className="text-xs text-slate-500 dark:text-slate-400 font-medium">{movimientosFiltrados.length} registros</span>
                        </div>
                        <div className="overflow-x-auto custom-scroll">
                            <table className="w-full text-left text-sm">
                                <thead className="bg-slate-50 dark:bg-slate-800/50 text-slate-400 dark:text-slate-500 text-xs uppercase font-bold tracking-wider border-b border-slate-100 dark:border-slate-800">
                                    <tr>
                                        <th className="px-5 py-3.5">Fecha</th>
                                        <th className="px-5 py-3.5">Tipo</th>
                                        <th className="px-5 py-3.5">Categoría</th>
                                        <th className="px-5 py-3.5">Detalle</th>
                                        <th className="px-5 py-3.5 text-right">Monto</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                                    {movimientosFiltrados.slice(0, 25).map((m, idx) => (
                                        <tr key={idx} className="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 transition">
                                            <td className="px-5 py-3.5 whitespace-nowrap text-slate-600 dark:text-slate-400 font-medium">{m.fecha?.split('T')[0] || '-'}</td>
                                            <td className="px-5 py-3.5 whitespace-nowrap">
                                                <span className={`inline-flex px-2 py-0.5 rounded-md text-xs font-bold ${
                                                    m.tipo?.toLowerCase() === 'ingreso'
                                                        ? 'bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400'
                                                        : 'bg-rose-50 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400'
                                                }`}>
                                                    {capitalizar(m.tipo)}
                                                </span>
                                            </td>
                                            <td className="px-5 py-3.5 font-semibold text-slate-700 dark:text-slate-200">{capitalizar(m.categoria)}</td>
                                            <td className="px-5 py-3.5 text-slate-500 dark:text-slate-400 max-w-[200px] truncate" title={m.detalle}>{m.detalle || '-'}</td>
                                            <td className="px-5 py-3.5 text-right font-bold text-slate-800 dark:text-slate-100">{formatearMoneda(m.monto)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            {movimientosFiltrados.length === 0 && !cargando && (
                                <div className="text-center py-10 text-slate-400 text-sm">
                                    No hay movimientos registrados para este periodo.
                                </div>
                            )}
                        </div>
                    </section>

                </div>
            );
        }

        // Montar la aplicación
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);

        // Registro de Service Worker para PWA (si existe sw.js)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
